<g font-size="18" text-anchor="middle"><text x="220" y="525">스탠드 정면 개념</text><text x="507" y="497">스탠드 평면 개념</text><text x="745" y="462">제어함</text><text x="745" y="491" fill="#64748b">치수 별도 확인</text></g>
<g font-size="16" fill="#64748b"><text x="40" y="570">참고: ZS Machinery Desktop UV · 공개 크기 약 300×550×800mm</text>
<text x="40" y="598">폭·깊이·높이 방향은 개념도 작성 시 가정. 참고 모델은 수냉식입니다.</text>
<text x="40" y="626">실제 공급 장비 크기·배치 간격·케이블 공간은 주문 전 확인해 주세요.</text></g>
