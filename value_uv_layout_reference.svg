<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
<title id="title">실속형 UV Laser 참고 배치도</title>
<desc id="desc">유사 장비 공개 치수 300×550×800mm를 참고한 개념도. 실제 제품 실측값이 아니며 제어함 치수와 설치 여유 공간은 별도 확인해야 합니다.</desc>
